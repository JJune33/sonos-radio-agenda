name: Install Sonos Radio Agenda source
on:
  push:
    branches: [main]
    paths:
      - sonos-ready.txt
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand application package
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, io, lzma, tarfile
          from pathlib import Path
          parts = sorted(Path('.').glob('sonos_part_*.txt'))
          if len(parts) != 12:
              raise RuntimeError('Expected exactly 12 archive parts')
          data = base64.b85decode(''.join(p.read_text() for p in parts))
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(data)), mode='r:') as archive:
              members = archive.getmembers()
              for member in members:
                  path = Path(member.name)
                  if not member.isfile() or path.is_absolute() or '..' in path.parts:
                      raise ValueError('Invalid entry: ' + member.name)
              for member in members:
                  dest = Path(member.name)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(archive.extractfile(member).read())
          for p in parts:
              p.unlink()
          Path('sonos-ready.txt').unlink()
          PY
      - name: Commit application files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Install Sonos Radio Agenda application'
          git push
